<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Blank Junior</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 34rem;
        margin: 4rem auto;
        padding: 0 1.25rem;
        line-height: 1.6;
        color: #222;
        background: #fff;
      }
      code {
        background: #f2f2f2;
        padding: 0.15em 0.35em;
        border-radius: 3px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #e8e8e8;
          background: #16181c;
        }
        code {
          background: #26292f;
        }
      }
    </style>
  </head>
  <body>
    <h1>Blank Junior</h1>
    <p>
      A Discord bot. There is no web interface here — this page exists only so the
      deployment has a static output directory.
    </p>
    <p>
      The bot is served from <code>/api/interactions</code>, which accepts signed
      POST requests from Discord and nothing else.
    </p>
  </body>
</html>
